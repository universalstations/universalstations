<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0f18"/>
      <stop offset="1" stop-color="#06060b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- fond arrondi -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#glow)"/>
  <!-- liseré ambre -->
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- "US" : U blanc, S jaune -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Syne','Trebuchet MS','Segoe UI',Arial,sans-serif"
        font-weight="800" font-size="34" letter-spacing="-1">
    <tspan fill="#ffffff">U</tspan><tspan fill="#fcd34d">S</tspan>
  </text>
</svg>
