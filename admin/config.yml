backend:
  name: git-gateway
  branch: main

media_folder: "assets/blog"
public_folder: "/assets/blog"

locale: fr

collections:
  - name: "articles"
    label: "Articles"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Tag / Catégorie", name: "tag", widget: "string", hint: "Ex: À la une · Rap" }
      - { label: "Extrait", name: "excerpt", widget: "text", hint: "Résumé court affiché sur la carte" }
      - { label: "Contenu", name: "body", widget: "markdown" }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "DD MMMM YYYY", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Image de couverture", name: "image", widget: "image", required: false, hint: "Photo d'en-tête de l'article" }
      - { label: "Article mis en avant", name: "featured", widget: "boolean", default: false }
